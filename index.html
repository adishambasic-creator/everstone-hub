<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EverStone Hub</title>
<meta name="theme-color" content="#05061a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EverStone">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05061a; --panel:rgba(17,19,48,.72); --panel2:rgba(26,28,68,.55); --line:rgba(132,120,255,.18); --line2:rgba(150,135,255,.35);
  --text:#ecebff; --muted:#9b9dcb; --dim:#6d6f9c;
  --a1:#4f7cff; --a2:#a855f7; --a3:#c084fc;
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --cyan:#38bdf8;
  --grad:linear-gradient(90deg,#4f6bff,#9b4dff);
}
*{box-sizing:border-box}
html,:root{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 88% -8%,rgba(124,58,237,.38),transparent 62%),
   radial-gradient(760px 520px at -12% 28%,rgba(59,91,255,.24),transparent 60%),
   radial-gradient(700px 420px at 55% 112%,rgba(168,85,247,.22),transparent 62%),
   radial-gradient(rgba(140,130,255,.10) 1px,transparent 1.2px) 0 0/26px 26px;}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- Sidebar ---------- */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(7,8,28,.62);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 0 26px rgba(124,58,237,.6)}
.brand b{display:block;font-size:15.5px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .sec{font-size:10.5px;letter-spacing:.24em;color:var(--dim);font-weight:700;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;transition:.15s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(79,124,255,.24),rgba(168,85,247,.12));box-shadow:inset 0 0 0 1px rgba(130,120,255,.38),0 0 24px rgba(124,58,237,.22)}
.nav a.on svg{color:#b9a8ff;filter:drop-shadow(0 0 6px rgba(160,120,255,.8))}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(251,113,133,.18);color:#ffb4c0;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--dim);padding:0 10px}

/* ---------- Main ---------- */
main{padding:30px 34px 90px;width:100%;max-width:1320px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{display:inline-block;letter-spacing:.42em;font-size:10.5px;font-weight:800;padding:5px 9px 5px 13px;border:1px solid rgba(160,140,255,.55);border-radius:6px;color:#dcd6ff;box-shadow:0 0 18px rgba(124,58,237,.35),inset 0 0 10px rgba(124,58,237,.2);text-transform:uppercase}
h1.title{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;margin:12px 0 4px;line-height:1.05}
.grad{background:linear-gradient(90deg,#5b7cff,#8b5cf6 55%,#c98bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0}
h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:14px;margin:0;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);min-width:0}
.card.glow{box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(130,110,255,.22),0 0 46px rgba(99,70,255,.16)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch .muted{font-size:12.5px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(99,90,255,.14);border:1px solid var(--line2);color:#b7a6ff;box-shadow:0 0 20px rgba(124,58,237,.25);flex:none}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:11.5px;margin-top:2px}
.up{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:650;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(170,150,255,.6)}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:0 6px 24px rgba(124,58,237,.45)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.danger{border-color:rgba(251,113,133,.4);color:#ffb3c0}
.ibtn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.ibtn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:var(--line)}
input,select,textarea{background:rgba(9,10,32,.85);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:rgba(150,120,255,.75);box-shadow:0 0 0 3px rgba(124,58,237,.22)}
textarea{width:100%;resize:vertical;min-height:80px}
select option{background:#14153a}

/* pills/chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cfd0f5;white-space:nowrap}
.pill.p-blue{background:rgba(79,124,255,.15);border-color:rgba(79,124,255,.4);color:#b9c8ff}
.pill.p-purple{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.45);color:#e0c4ff}
.pill.p-green{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.4);color:#a8f0d3}
.pill.p-amber{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4);color:#fde19a}
.pill.p-red{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.45);color:#ffb8c4}
.pill.p-cyan{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4);color:#b4e6ff}
.pill.p-gray{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:9px;background:rgba(79,124,255,.12);border:1px solid rgba(110,130,255,.35);color:#c9d3ff}
.chip:hover{background:rgba(79,124,255,.24);color:#fff}
.chip.sms{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.38);color:#e2c9ff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer}
.filters button.on{background:rgba(124,58,237,.22);border-color:rgba(160,130,255,.6);color:#fff;box-shadow:0 0 16px rgba(124,58,237,.3)}

/* progress */
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f7cff,#b14cff);border-radius:99px;box-shadow:0 0 12px rgba(150,90,255,.7);transition:width .35s}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,#fb7185)}
.bar.thin{height:5px}
.ring text{font-weight:800;fill:#fff}

/* build cards */
.bcard{display:flex;gap:16px;align-items:flex-start;transition:.18s}
.bcard:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 36px rgba(110,80,255,.2)}
.bcard .info{min-width:0;flex:1}
.bcard .nm{font-weight:750;font-size:15.5px;letter-spacing:-.01em}
.bcard .ad{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:12.5px;margin-top:7px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600}

/* checklist */
.ckhead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.phase{padding:0;overflow:hidden}
.phase>header{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer;user-select:none}
.phase>header:hover{background:rgba(255,255,255,.025)}
.pnum{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(99,90,255,.16);border:1px solid var(--line2);color:#c7b9ff;flex:none}
.phase.complete .pnum{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(124,58,237,.5)}
.phase .pt{flex:1;min-width:0}
.phase .pt small{color:var(--muted);font-size:12px}
.phase .pbar{width:120px}
.chev{transition:.2s;color:var(--muted)}
.phase.closed .chev{transform:rotate(-90deg)}
.phase.closed .steps{display:none}
.steps{border-top:1px solid var(--line)}
.step{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(130,120,255,.09);position:relative}
.step:last-child{border-bottom:0}
.step.done .stitle{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(160,150,255,.45)}
.step.next{background:linear-gradient(90deg,rgba(124,58,237,.14),transparent 70%)}
.step.next::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px rgba(150,90,255,.9)}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stitle{font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nexttag{font-size:10.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--grad);box-shadow:0 0 14px rgba(124,58,237,.55)}
.snote-static{font-size:12.5px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.datef{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.datef input{padding:5px 8px;font-size:12.5px}
.datef.set input{border-color:rgba(79,124,255,.55);color:#cdd8ff}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-weight:600;font-size:12.5px;padding:2px 0;display:inline-flex;gap:5px;align-items:center}
.linkbtn:hover{color:#fff}
.sugg{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#b4e6ff;border:1px solid rgba(56,189,248,.4);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}

/* checkbox */
.cb{position:relative;display:inline-grid;flex:none;cursor:pointer;margin-top:1px}
.cb input{position:absolute;opacity:0;width:0;height:0}
.cb span{width:22px;height:22px;border-radius:7px;border:1.6px solid rgba(150,140,255,.55);display:grid;place-items:center;transition:.15s;background:rgba(9,10,32,.6)}
.cb span::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:.15s}
.cb input:checked+span{background:var(--grad);border-color:transparent;box-shadow:0 0 14px rgba(140,90,255,.7)}
.cb input:checked+span::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.cb input:focus-visible+span{box-shadow:0 0 0 3px rgba(124,58,237,.45)}

/* tasks */
.tbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:center}.tbar input[name=title]{grid-column:1/-1}.tbar>*{min-width:0;width:100%}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid transparent;transition:.12s}
.task:hover{background:rgba(255,255,255,.03);border-color:var(--line)}
.task .tmain{flex:1;min-width:0}
.task .ttitle{font-weight:620}
.task.done .ttitle{color:var(--dim);text-decoration:line-through}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.pdot.High{background:var(--bad);box-shadow:0 0 8px var(--bad)} .pdot.Med{background:var(--warn)} .pdot.Low{background:var(--cyan)}
.tgroup{margin-top:6px}
.tgroup>.gl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--dim);padding:12px 12px 4px}
.tgroup>.gl.bad{color:#ff9fb0}

/* agenda */
.ag{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:12px}
.ag:hover{background:rgba(255,255,255,.03)}
.dbox{width:50px;flex:none;text-align:center;border-radius:12px;padding:5px 0;background:rgba(99,90,255,.12);border:1px solid var(--line)}
.dbox small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dbox b{font-size:18px;font-weight:800;line-height:1.1}
.ag.over .dbox{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.4)}
.ag .am{flex:1;min-width:0}
.ag .at{font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag .as{font-size:12px;color:var(--muted)}

/* tables & lists */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.dl div small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.dl div span{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid rgba(130,120,255,.08)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .big{font-size:17px;color:var(--text);font-weight:700;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:10px}
.back:hover{color:#fff}
.lcard{display:flex;flex-direction:column;gap:10px;transition:.18s}
.lcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.lcard .price{font-size:22px;font-weight:800;letter-spacing:-.02em}
.facts{display:flex;gap:14px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.facts b{color:var(--text)}
.ccard{display:flex;flex-direction:column;gap:8px}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,rgba(79,124,255,.35),rgba(168,85,247,.35));border:1px solid var(--line2)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);margin-bottom:18px;font-size:13px}

/* realtor */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.pcol{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:110px}
.pcol h4{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between;font-weight:800}
.pc{display:block;padding:10px 11px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;font-size:13px;transition:.15s}
.pc:hover{border-color:var(--line2);box-shadow:0 0 18px rgba(110,80,255,.2)}
.logf{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px}
@media(max-width:560px){.logf{grid-template-columns:1fr auto}.logf input{grid-column:1/-1;order:-1}}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--line2);transition:.2s;cursor:pointer}
.sw span::after{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--grad);border-color:transparent;box-shadow:0 0 14px rgba(140,90,255,.6)}.sw input:checked+span::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(130,120,255,.09)}.setrow:last-child{border-bottom:0}.setrow .sp b{display:block;font-weight:650}.setrow .sp small{color:var(--muted);font-size:12.5px}
.steps-ol{margin:0;padding-left:20px;color:var(--muted);font-size:13px;display:grid;gap:6px}.steps-ol b{color:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,3,15,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#0f1036;border:1px solid var(--line2);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(110,70,255,.25)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 18px}
.fgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:650;color:var(--muted)}
.fgrid label.full{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;min-width:0}
#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1a1b4a;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-weight:600;transition:.25s;z-index:200;box-shadow:0 0 30px rgba(110,70,255,.35);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:30;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}.brand div{display:none}.logo{width:36px;height:36px}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;min-width:0;flex:1}
  .nav::-webkit-scrollbar{display:none}
  .nav .sec,.side-foot,.nav .cnt{display:none}
  .nav a{flex-direction:column;gap:3px;padding:7px 10px;font-size:10.5px;flex:none}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}

const pill=(t,c)=>`<span class="pill ${c||STATUS_COLOR[t]||''}">${esc(t)}</span>`;

/* ================= BUILD LOGIC ================= */
function stepsOf(b){return ALL_STEPS.concat((b.custom||[]).map(c=>({id:c.id,t:c.t,d:1,custom:1,phaseId:'custom',phaseName:'Custom steps'})))}
function progress(b){const st=stepsOf(b);const done=st.filter(s=>b.checks[s.id]).length;return {done,total:st.length,pct:st.length?done/st.length:0}}
function nextStep(b){return stepsOf(b).find(s=>!b.checks[s.id])}
function nextDated(b){return stepsOf(b).filter(s=>!b.checks[s.id]&&b.dates[s.id]).sort((x,y)=>b.dates[x.id]<b.dates[y.id]?-1:1)[0]}
function buildSpent(b){return (b.expenses||[]).reduce((a,e)=>a+(+e.amount||0),0)}

function agendaItems(){const out=[];const T=TODAY();
 S.builds.forEach(b=>{stepsOf(b).forEach(s=>{const d=b.dates[s.id];if(d&&!b.checks[s.id])out.push({date:d,title:s.t,sub:b.name,kind:'Build',cls:'p-purple',href:'#checklist/'+b.id})});
  if(b.targetDate&&!['Complete','Listed','Sold'].includes(b.status))out.push({date:b.targetDate,title:'Target completion',sub:b.name,kind:'Milestone',cls:'p-blue',href:'#build/'+b.id})});
 S.listings.forEach(l=>{(l.showings||[]).forEach(sh=>{if(sh.date&&sh.date>=T)out.push({date:sh.date,title:(sh.type||'Showing')+(sh.who?' — '+sh.who:''),sub:l.address,kind:'Showing',cls:'p-amber',href:'#listing/'+l.id})});
  if(l.status==='Pending'&&l.closeDate)out.push({date:l.closeDate,title:'Closing',sub:l.address,kind:'Closing',cls:'p-green',href:'#listing/'+l.id})});
 S.clients.forEach(c=>{if(c.followUp&&!['Closed','Lost'].includes(c.stage))out.push({date:c.followUp,title:'Follow up — '+c.name,sub:(c.type||'Client')+' · '+c.stage,kind:'Follow-up',cls:'p-cyan',href:'#client/'+c.id})});
 S.tasks.forEach(t=>{if(t.due&&!t.done)out.push({date:t.due,title:t.title,sub:linkName(t.link)||t.cat,kind:'Task',cls:t.cat==='EverStone'?'p-blue':'p-cyan',href:'#tasks',cat:t.cat})});
 return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function gcal(it){const d=it.date.replace(/-/g,'');const n=pd(it.date);n.setDate(n.getDate()+1);
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.title+(it.sub?' — '+it.sub:''))+'&dates='+d+'/'+ymd(n).replace(/-/g,'')+'&details='+encodeURIComponent('From EverStone Hub ('+it.kind+')')}
function agendaRow(it){const over=it.date<TODAY();const d=pd(it.date);
 return `<div class="ag ${over?'over':''}"><div class="dbox"><small>${d.toLocaleDateString(undefined,{month:'short'})}</small><b>${d.getDate()}</b></div>
 <a class="am" href="${it.href}"><div class="at">${esc(it.title)}</div><div class="as">${esc(it.sub||'')} · <span class="${over?'bad':''}">${rel(it.date)}</span></div></a>
 ${pill(it.kind,it.cls)}<a class="ibtn" title="Add to Google Calendar" target="_blank" rel="noopener" href="${gcal(it)}">${ic('cal',16)}</a></div>`}

/* ================= TASKS ================= */
function linkName(link){if(!link)return '';const[t,id]=link.split(':');if(t==='build'){const b=getB(id);return b?b.name:''}if(t==='client'){const c=getCl(id);return c?c.name:''}const l=getL(id);return l?l.address:''}
function linkHref(link){if(!link)return '';const[t,id]=link.split(':');return t==='build'?'#build/'+id:t==='client'?'#client/'+id:'#listing/'+id}
function linkOptions(sel){let h='<option value="">No home linked</option>';
 if(S.builds.length)h+='<optgroup label="EverStone builds">'+S.builds.map(b=>`<option value="build:${b.id}" ${sel==='build:'+b.id?'selected':''}>${esc(b.name)}</option>`).join('')+'</optgroup>';
 if(S.listings.length)h+='<optgroup label="Real estate">'+S.listings.map(l=>`<option value="listing:${l.id}" ${sel==='listing:'+l.id?'selected':''}>${esc(l.address)}</option>`).join('')+'</optgroup>';
 if(S.clients.length)h+='<optgroup label="Realtor clients">'+S.clients.map(c=>`<option value="client:${c.id}" ${sel==='client:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')+'</optgroup>';return h}
function taskBar(pre={}){return `<form class="tbar" data-form="task">
 <input name="title" placeholder="Add a task… e.g. Call Jorge about garage flatwork" required autocomplete="off">
 <select name="cat" aria-label="Category">${['EverStone','Real Estate'].map(c=>`<option ${(pre.cat||'EverStone')===c?'selected':''}>${c}</option>`).join('')}</select>
 <select name="link" data-ch="tlink" aria-label="Linked home">${linkOptions(pre.link)}</select>
 <input type="date" name="due" aria-label="Due date">
 <input type="time" name="time" aria-label="Reminder time" title="Reminder time (optional)">
 <select name="pri" aria-label="Priority"><option value="High">High</option><option value="Med" selected>Medium</option><option value="Low">Low</option></select>
 <button class="btn primary">${ic('plus',16)} Add</button></form>`}
function taskRow(t,showLink=true){const over=t.due&&!t.done&&t.due<TODAY();const ln=linkName(t.link);
 return `<div class="task ${t.done?'done':''}"><label class="cb"><input type="checkbox" data-ch="task" data-id="${t.id}" ${t.done?'checked':''} aria-label="Done"><span></span></label>
 <span class="pdot ${t.pri||'Med'}" title="${t.pri==='Med'?'Medium':t.pri} priority"></span>
 <div class="tmain"><div class="ttitle">${esc(t.title)}</div><div class="tmeta">${pill(t.cat,t.cat==='EverStone'?'p-blue':'p-cyan')}
 ${showLink&&ln?`<a class="pill" href="${linkHref(t.link)}">${ic(t.link.startsWith('build')?'home':t.link.startsWith('client')?'user':'tag',12)} ${esc(ln)}</a>`:''}
 ${t.due?`<span class="pill ${over?'p-red':''}">${ic('clock',12)} ${t.done?fmt(t.due):rel(t.due)}${t.time?' · '+fmtTime(t.time):''}</span>`:''}
 ${t.notes?`<span class="pill p-gray" title="${esc(t.notes)}">${ic('note',12)} note</span>`:''}</div></div>
 <button class="ibtn" data-act="editTask" data-id="${t.id}" title="Edit">${ic('edit',16)}</button><button class="ibtn" data-act="delTask" data-id="${t.id}" title="Delete">${ic('trash',16)}</button></div>`}
const fmtTime=t=>{const[h,m]=String(t).split(':').map(Number);return new Date(2000,0,1,h||0,m||0).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
function sortTasks(a){return a.slice().sort((x,y)=>{if(x.done!==y.done)return x.done?1:-1;const pr={High:0,Med:1,Low:2};
 if((x.due||'9')!==(y.due||'9'))return (x.due||'9')<(y.due||'9')?-1:1;if((x.time||'99')!==(y.time||'99'))return (x.time||'99')<(y.time||'99')?-1:1;return pr[x.pri||'Med']-pr[y.pri||'Med']})}
function taskList(list,emptyMsg){if(!list.length)return `<div class="empty">${emptyMsg||'Nothing here yet.'}</div>`;return sortTasks(list).map(t=>taskRow(t)).join('')}

/* ================= PAGES ================= */
function head(eb,t1,t2,sub,actions=''){return `<div class="ph"><div><span class="eyebrow">${eb}</span><h1 class="title">${t1} <span class="grad">${t2}</span></h1>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="row">${actions}</div></div>`}
function kpi(icon,v,l,d=''){return `<div class="card kpi"><div class="ic">${ic(icon,20)}</div><div><div class="v">${v}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:''}</div></div>`}

function pgDashboard(){const T=TODAY();const h=new Date().getHours();const greet=h<12?'Good morning,':h<17?'Good afternoon,':'Good evening,';
 const col=(cat,label,icon)=>{const open=sortTasks(S.tasks.filter(t=>t.cat===cat&&!t.done));const over=open.filter(t=>t.due&&t.due<T).length;
  return `<div class="card glow"><div class="ch"><h2 class="row" style="gap:8px">${ic(icon,18)} ${label}</h2><span class="muted">${open.length} open${over?` · <span class="bad">${over} overdue</span>`:''}</span></div>
  ${open.length?open.map(t=>taskRow(t)).join(''):`<div class="empty" style="padding:22px">No upcoming ${label} tasks.</div>`}</div>`};
 return head('Home',greet,esc(S.meta.name||'Adis'),new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))
 +`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px;align-items:start">${col('EverStone','EverStone','home')}${col('Real Estate','Realtor','briefcase')}</div>`}
function dashBuild(b){const p=progress(b),n=nextStep(b),nd=nextDated(b);
 return `<a class="card bcard" href="#build/${b.id}" style="padding:14px;background:var(--panel2)">${ring(p.pct,56,5)}<div class="info"><div class="row" style="gap:8px"><span class="nm">${esc(b.name)}</span>${pill(b.status)}</div>
 <div class="kv">Up next: <b>${n?esc(n.t):'All steps done 🎉'}</b></div>${nd?`<div class="kv">${ic('cal',13)} <b>${esc(nd.t)}</b> · ${rel(b.dates[nd.id])}</div>`:''}</div></a>`}

function pgBuilds(){
 const f=S.ui.bFilter||'All';const list=S.builds.filter(b=>f==='All'||b.status===f);
 const actives=S.builds.filter(b=>!['Complete','Listed','Sold'].includes(b.status));
 const totBudget=actives.reduce((a,b)=>a+(+b.budget||0),0),totSpent=actives.reduce((a,b)=>a+buildSpent(b),0);
 const evT=S.tasks.filter(t=>t.cat==='EverStone'&&!t.done);
 return head('EverStone Homes','Build','Pipeline','Every home you\'re building, its progress, and what\'s next.',`<button class="btn primary" data-act="newBuild">${ic('plus',16)} New build</button>`)
 +`<div class="kpis">${kpi('home',actives.length,'Active builds')}${kpi('check',S.builds.filter(b=>['Complete','Listed','Sold'].includes(b.status)).length,'Completed')}
 ${kpi('dollar',moneyK(totBudget),'Active budgets',totBudget?`${moneyK(totSpent)} spent`:'')}${kpi('list',evT.length,'Open EverStone tasks')}</div>
 <div class="filters" style="margin-bottom:16px">${['All',...BUILD_STATUS].map(s=>`<button class="${f===s?'on':''}" data-act="bFilter" data-v="${s}">${s}</button>`).join('')}</div>
 ${list.length?`<div class="grid3">${list.map(b=>{const p=progress(b),n=nextStep(b),nd=nextDated(b);const cur=n?n.phaseName:'Done';
  return `<a class="card bcard" href="#build/${b.id}">${ring(p.pct,72,6)}<div class="info"><div class="row" style="gap:8px;justify-content:space-between"><span class="nm">${esc(b.name)}</span>${pill(b.status)}</div>
  <div class="ad">${esc(b.address||'No address yet')}${b.community?' · '+esc(b.community):''}</div>
  <div class="kv">Phase: <b>${esc(cur)}</b></div><div class="kv">Next: <b>${n?esc(n.t):'—'}</b></div>
  ${nd?`<div class="kv">${ic('cal',13)} ${esc(nd.t)} · <b>${rel(b.dates[nd.id])}</b></div>`:''}
  ${b.startDate?`<div class="kv">${ic('clock',13)} Day <b>${Math.max(0,days(b.startDate,TODAY()))}</b>${b.targetDate?` · target ${fmt(b.targetDate)}`:''}</div>`:''}</div></a>`}).join('')}</div>`
 :`<div class="card empty"><div class="big">${S.builds.length?'No builds with this status':'No builds yet'}</div>Each new build gets its own copy of your full checklist.<br><br><button class="btn primary" data-act="newBuild">${ic('plus',16)} New build</button></div>`}
 <div class="card" style="margin-top:18px"><div class="ch"><h2>EverStone tasks</h2><span class="muted">${evT.length} open</span></div>${taskBar({cat:'EverStone'})}<div style="margin-top:10px">${taskList(S.tasks.filter(t=>t.cat==='EverStone'&&!t.done),'No open EverStone tasks.')}</div></div>`}

function pgBuild(id){const b=getB(id);if(!b)return notFound('Build');
 const p=progress(b),n=nextStep(b),spent=buildSpent(b),budget=+b.budget||0;
 const up=stepsOf(b).filter(s=>b.dates[s.id]&&!b.checks[s.id]).sort((x,y)=>b.dates[x.id]<b.dates[y.id]?-1:1).slice(0,6);
 const tasks=S.tasks.filter(t=>t.link==='build:'+b.id);
 const linkedL=S.listings.find(l=>l.buildId===b.id);
 return `<a class="back" href="#builds">${ic('left',16)} All builds</a>`
 +head(esc(b.company||'EverStone Homes'),esc(b.name),'',`${esc(b.address||'')}${b.community?' · '+esc(b.community):''}`,
  `${pill(b.status)}<button class="btn" data-act="editBuild" data-id="${b.id}">${ic('edit',16)} Edit</button>
  ${linkedL?`<a class="btn" href="#listing/${linkedL.id}">${ic('tag',16)} View listing</a>`:`<button class="btn" data-act="listingFromBuild" data-id="${b.id}">${ic('tag',16)} Create listing</button>`}
  <a class="btn primary" href="#checklist/${b.id}">${ic('check',16)} Open checklist</a>`)
 +`<div class="grid2"><div class="stack">
  <div class="card glow"><div class="row" style="gap:22px;align-items:center">${ring(p.pct,110,9)}<div class="sp" style="min-width:200px">
   <div class="muted" style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700">Current phase</div><div style="font-size:19px;font-weight:800;margin:2px 0 8px">${n?esc(n.phaseName):'Complete'}</div>
   <div class="kv">Up next: <b>${n?esc(n.t):'All steps done'}</b></div><div class="kv">${p.done} of ${p.total} steps done</div>
   ${b.startDate?`<div class="kv">Started ${fmt(b.startDate,1)} · day <b>${Math.max(0,days(b.startDate,TODAY()))}</b></div>`:''}
   ${b.targetDate?`<div class="kv">Target ${fmt(b.targetDate,1)} · <b class="${b.targetDate<TODAY()?'bad':''}">${rel(b.targetDate)}</b></div>`:''}</div></div>
   <div style="margin-top:16px">${PHASES.map(ph=>{const st=ph.steps;const dn=st.filter(s=>b.checks[s.id]).length;return `<div title="${esc(ph.name)}: ${dn}/${st.length}" style="display:inline-block;width:calc(${100/PHASES.length}% - 4px);margin-right:4px">${bar(dn/st.length,'thin')}</div>`}).join('')}
   <div class="dim" style="font-size:11.5px;margin-top:6px">Phase-by-phase progress</div></div></div>
  <div class="card"><div class="ch"><h2>Upcoming on this build</h2><a class="btn sm" href="#checklist/${b.id}">Set dates</a></div>
   ${up.length?up.map(s=>agendaRow({date:b.dates[s.id],title:s.t,sub:s.phaseName,kind:'Build',cls:'p-purple',href:'#checklist/'+b.id})).join(''):'<div class="empty" style="padding:18px">No planned dates yet. Add them on the checklist so crews are scheduled.</div>'}</div>
  <div class="card"><div class="ch"><h2>Budget & costs</h2><button class="btn sm" data-act="addExpense" data-id="${b.id}">${ic('plus',14)} Add cost</button></div>
   <div class="dl" style="margin-bottom:14px"><div><small>Construction budget</small><span>${money(b.budget)}</span></div><div><small>Lot price</small><span>${money(b.lotPrice)}</span></div>
   <div><small>Spent so far</small><span>${money(spent)}</span></div><div><small>Remaining</small><span class="${budget&&spent>budget?'bad':''}">${budget?money(budget-spent):'—'}</span></div></div>
   ${budget?bar(spent/budget,spent/budget>.9?'warn':''):''}
   ${b.expenses.length?`<table style="margin-top:12px"><tr><th>Date</th><th>Item</th><th>Vendor</th><th style="text-align:right">Amount</th><th></th></tr>${b.expenses.slice().sort((x,y)=>(y.date||'')<(x.date||'')?-1:1).map(e=>`<tr><td class="muted">${fmt(e.date)}</td><td>${esc(e.desc)}</td><td class="muted">${esc(e.vendor||'')}</td><td style="text-align:right;font-weight:650">${money(e.amount)}</td><td style="width:36px"><button class="ibtn" data-act="delExpense" data-id="${b.id}" data-e="${e.id}">${ic('trash',14)}</button></td></tr>`).join('')}</table>`:'<div class="dim" style="font-size:12.5px;margin-top:10px">Log draws, invoices and material costs to see where the budget stands.</div>'}</div>
 </div><div class="stack">
  <div class="card"><div class="ch"><h2>Details</h2></div><div class="dl">
   ${[['Floor plan',b.plan],['Beds / baths',(b.beds||'—')+' / '+(b.baths||'—')],['Sq ft',b.sqft?(+b.sqft).toLocaleString():''],['Community',b.community],['Buyer',b.buyer||'Spec home'],['Company',b.company]].map(([k,v])=>`<div><small>${k}</small><span>${esc(v||'—')}</span></div>`).join('')}</div>
   ${b.buyerPhone||b.buyerEmail?`<div class="row" style="margin-top:12px">${b.buyerPhone?`<a class="chip" href="tel:${esc(b.buyerPhone)}">${ic('phone',13)} Call buyer</a><a class="chip sms" href="sms:${esc(b.buyerPhone)}">${ic('msg',13)} Text</a>`:''}${b.buyerEmail?`<a class="chip" href="mailto:${esc(b.buyerEmail)}?subject=${encodeURIComponent((b.address||b.name)+' — build update')}">${ic('mail',13)} Email buyer</a>`:''}</div>`:''}</div>
  <div class="card"><div class="ch"><h2>Tasks for this build</h2></div>${taskBar({cat:'EverStone',link:'build:'+b.id})}<div style="margin-top:10px">${taskList(tasks,'No tasks linked to this build.')}</div></div>
  <div class="card"><div class="ch"><h2>Notes</h2><span class="dim" style="font-size:12px">Saves automatically</span></div><textarea data-ch="field" data-type="build" data-id="${b.id}" data-k="notes" rows="6" placeholder="Selections, change orders, lot details…">${esc(b.notes||'')}</textarea></div>
  <button class="btn danger" data-act="delBuild" data-id="${b.id}" style="align-self:flex-start">${ic('trash',16)} Delete build</button>
 </div></div>`}

function pgChecklist(id){
 if(!S.builds.length)return head('Build checklist','Step-by-step','Checklist','')+`<div class="card empty"><div class="big">Add a build first</div>Each home gets its own copy of the checklist with its own checkmarks and dates.<br><br><button class="btn primary" data-act="newBuild">${ic('plus',16)} New build</button></div>`;
 const b=getB(id)||getB(S.ui.lastBuild)||S.builds[0];S.ui.lastBuild=b.id;
 const f=S.ui.ckFilter||'all';const p=progress(b);const nx=nextStep(b);
 const groups=PHASES.map((ph,i)=>({id:ph.id,num:i+1,name:ph.name,sub:ph.sub,suggested:ph.suggested,steps:ph.steps}));
 if(b.custom.length)groups.push({id:'custom',num:'+',name:'Custom steps for this build',steps:b.custom.map(c=>({id:c.id,t:c.t,d:1,custom:1}))});
 const vis=s=>f==='all'||(f==='remaining'&&!b.checks[s.id])||(f==='done'&&b.checks[s.id])||(f==='scheduled'&&b.dates[s.id]&&!b.checks[s.id]);
 const subj=s=>encodeURIComponent((b.address||b.name)+' — '+s.t);
 const html=groups.map(g=>{const st=g.steps.filter(vis);if(!st.length)return '';const dn=g.steps.filter(s=>b.checks[s.id]).length;const closed=S.ui.collapsed[g.id]&&f==='all';
  return `<section class="card phase ${dn===g.steps.length?'complete':''} ${closed?'closed':''}"><header data-act="togglePhase" data-p="${g.id}"><span class="pnum">${g.num}</span>
  <div class="pt"><h3>${esc(g.name)}${g.suggested?'<span class="sugg">Suggested</span>':''}</h3><small>${dn} of ${g.steps.length} done${g.sub?' · '+esc(g.sub):''}</small></div>
  <div class="pbar">${bar(dn/g.steps.length,'thin')}</div><span class="chev">${ic('chev',18)}</span></header><div class="steps">
  ${st.map(s=>{const done=!!b.checks[s.id],dt=b.dates[s.id]||'',nt=b.notesBy[s.id]||'';const isNext=nx&&nx.id===s.id;
   return `<div class="step ${done?'done':''} ${isNext?'next':''}"><label class="cb"><input type="checkbox" data-ch="step" data-b="${b.id}" data-s="${s.id}" ${done?'checked':''} aria-label="Mark done"><span></span></label>
   <div class="sbody"><div class="stitle">${esc(s.t)}${isNext?'<span class="nexttag">Up next</span>':''}</div>
   ${s.b?`<div class="row" style="gap:6px">${s.b.map(([k,t])=>`<span class="pill ${BADGE_CLASS[k]}">${k==='winter'?'❄ ':''}${esc(t)}</span>`).join('')}</div>`:''}
   ${s.note?`<div class="snote-static">${esc(s.note)}</div>`:''}
   ${s.c?`<div class="row" style="gap:6px">${s.c.map(cid=>{const c=getC(cid);if(!c)return '';return (c.email?`<a class="chip" href="mailto:${esc(c.email)}?subject=${subj(s)}">${ic('mail',13)} ${esc(c.name)}</a>`:'')
     +(c.phone?`<a class="chip" href="tel:${esc(c.phone)}">${ic('phone',13)} ${esc(c.name)} · ${esc(c.phone)}</a><a class="chip sms" href="sms:${esc(c.phone)}" title="Text ${esc(c.name)}">${ic('msg',13)} Text</a>`:'')
     +(!c.email&&!c.phone?`<a class="chip" href="#contacts" title="Add contact info">${ic('users',13)} ${esc(c.name)} · add info</a>`:'')}).join('')}</div>`:''}
   <div class="srow">${s.d?`<label class="datef ${dt?'set':''}">${ic('cal',14)} Planned <input type="date" data-ch="sdate" data-b="${b.id}" data-s="${s.id}" value="${dt}"></label>${dt&&!done?`<span class="${dt<TODAY()?'bad':'muted'}">${rel(dt)}</span>`:''}`:''}
   <button class="linkbtn" data-act="noteToggle">${ic('note',14)} ${nt?'Note':'Add note'}</button>
   ${done&&b.doneAt[s.id]?`<span class="dim">Done ${fmt(b.doneAt[s.id])}</span>`:''}
   ${s.custom?`<button class="linkbtn" data-act="delCustom" data-b="${b.id}" data-s="${s.id}">${ic('trash',14)} Remove</button>`:''}</div>
   <textarea data-ch="snote" data-b="${b.id}" data-s="${s.id}" rows="2" placeholder="Quote amount, who confirmed, gate code…" ${nt?'':'hidden'} style="min-height:56px">${esc(nt)}</textarea></div></div>`}).join('')}

  if(f.t==='select'){const opts=f.optsFn?f.optsFn():f.opts.map(o=>Array.isArray(o)?o:[o,o]);inp=`<select name="${f.k}">${opts.map(([val,lab])=>`<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`).join('')}</select>`}

  else inp=`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} value="${esc(v)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">`;
  return `<label class="${full}">${f.l}${inp}</label>`}).join('')}</div>${extra}
 <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">Save</button></div></form>`;
 m.hidden=false;m._save=onSave;m._fields=fields;setTimeout(()=>{const i=m.querySelector('input,select');i&&i.focus()},30)}
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
function closeModal(){const m=$('#modal');if(m._ask){m._ask(false);return}m.hidden=true;m.innerHTML=''}
function ask(msg,label='Delete'){return new Promise(res=>{const m=$('#modal');
 m.innerHTML=`<div class="mbox" role="alertdialog" style="width:min(440px,100%)"><h2 style="font-size:18px">Are you sure?</h2><p class="muted">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="askNo">Cancel</button><button type="button" class="btn ${['Replace','Use cloud data','Disconnect'].includes(label)?'primary':'danger'}" id="askYes">${esc(label)}</button></div></div>`;
 m.hidden=false;const done=v=>{m._ask=null;m.hidden=true;m.innerHTML='';res(v)};m._ask=done;
 m.querySelector('#askNo').onclick=()=>done(false);m.querySelector('#askYes').onclick=()=>done(true);setTimeout(()=>{const b=m.querySelector('#askYes');b&&b.focus()},30)})}

 async pushOff(){try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await api('/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}}catch(e){}PUSH_ON=false;render();toast('Notifications off on this device')},
 async testPush(){try{const r=await api('/test',{method:'POST'});toast(r.sent?'Test sent — check your notifications':'No devices received it. Turn notifications off and on again.')}catch(e){toast('Could not send: '+e.message)}},
 newClient(){openForm('New client',CLIENT_FIELDS,{type:'Buyer',stage:'Lead'},d=>{const c=Object.assign({id:uid(),created:TODAY(),log:[]},d);if(c.stage==='Closed')c.closedDate=TODAY();S.clients.unshift(c);save();go('#client/'+c.id);toast('Client added')})},
 editClient(el){const c=getCl(el.dataset.id);openForm('Edit client',CLIENT_FIELDS,c,d=>{if(d.stage==='Closed'&&c.stage!=='Closed')c.closedDate=TODAY();Object.assign(c,d);save();render();toast('Saved')})},
 async delClient(el){const c=getCl(el.dataset.id);if(!await ask(`Delete client "${c.name}"?`))return;S.clients=S.clients.filter(x=>x!==c);S.listings.forEach(l=>{if(l.clientId===c.id)l.clientId=''});S.tasks.forEach(t=>{if(t.link==='client:'+c.id)t.link=''});save();go('#clients');toast('Client deleted')},
 dealFromClient(el){const c=getCl(el.dataset.id);const sell=c.type==='Seller';ACT.newListing(null,{clientId:c.id,client:c.name,clientPhone:c.phone||'',clientEmail:c.email||'',side:sell?'Listing':'Buyer',status:sell?'Coming Soon':'Active',listDate:sell?TODAY():''})},
 clStage(el){S.ui.clStage=el.dataset.v;save();render()},
 fu(el){const c=getCl(el.dataset.id);const d=new Date();d.setDate(d.getDate()+(+el.dataset.d));c.followUp=ymd(d);save();render();toast('Follow-up set for '+fmt(c.followUp))},
 delLog(el){const c=getCl(el.dataset.id);c.log=c.log.filter(e=>e.id!==el.dataset.e);save();render()},
 newBuild(){openForm('New build',BUILD_FIELDS,{company:'EverStone Homes',status:'Pre-construction'},d=>{const b=Object.assign({id:uid(),created:TODAY(),checks:{},dates:{},notesBy:{},doneAt:{},custom:[],expenses:[]},d);S.builds.unshift(b);save();go('#build/'+b.id);toast('Build created — checklist ready')})},
 editBuild(el){const b=getB(el.dataset.id);openForm('Edit build',BUILD_FIELDS,b,d=>{Object.assign(b,d);save();render();toast('Saved')})},
 async delBuild(el){const b=getB(el.dataset.id);if(!await ask(`Delete "${b.name}" and its checklist progress? This can't be undone.`))return;S.builds=S.builds.filter(x=>x!==b);S.listings.forEach(l=>{if(l.buildId===b.id)l.buildId=''});save();go('#builds');toast('Build deleted')},
 bFilter(el){S.ui.bFilter=el.dataset.v;save();render()},
 togglePhase(el){const p=el.dataset.p;if(S.ui.ckFilter!=='all')return;S.ui.collapsed[p]=!S.ui.collapsed[p];save();el.parentElement.classList.toggle('closed',!!S.ui.collapsed[p])},
 expandAll(){S.ui.collapsed={};save();render()},
 collapseDone(){const b=getB(S.ui.lastBuild);if(!b)return;PHASES.forEach(ph=>{if(ph.steps.every(s=>b.checks[s.id]))S.ui.collapsed[ph.id]=true});save();render()},
 ckFilter(el){S.ui.ckFilter=el.dataset.v;save();render()},
 noteToggle(el){const ta=el.closest('.sbody').querySelector('textarea');ta.hidden=!ta.hidden;if(!ta.hidden)ta.focus()},
 addCustom(el){const b=getB(el.dataset.id);openForm('Add a custom step',[F('t','Step','text',{full:1,req:1,ph:'e.g. Install radon mitigation'})],{},d=>{b.custom.push({id:'cx_'+uid(),t:d.t});save();render();toast('Step added to this build')})},
 async delCustom(el){const b=getB(el.dataset.b);if(!await ask('Remove this custom step?'))return;b.custom=b.custom.filter(c=>c.id!==el.dataset.s);delete b.checks[el.dataset.s];delete b.dates[el.dataset.s];save();render()},
 addExpense(el){const b=getB(el.dataset.id);openForm('Log a cost',[F('desc','Item','text',{full:1,req:1,ph:'e.g. Foundation pour'}),F('vendor','Vendor'),F('amount','Amount ($)','number',{req:1}),F('date','Date','date')],{date:TODAY()},d=>{b.expenses.push(Object.assign({id:uid()},d));save();render();toast('Cost logged')})},
 delExpense(el){const b=getB(el.dataset.id);b.expenses=b.expenses.filter(e=>e.id!==el.dataset.e);save();render()},
 listingFromBuild(el){const b=getB(el.dataset.id);ACT.newListing(null,{address:b.address||b.name,beds:b.beds,baths:b.baths,sqft:b.sqft,buildId:b.id,status:'Coming Soon',side:'Listing',ptype:new Date().getFullYear()+' · New construction',client:b.company||'EverStone Homes'})},
 newListing(el,pre){openForm('New listing',LIST_FIELDS,Object.assign({status:'Active',side:'Listing',listDate:TODAY()},pre||{}),d=>{fillClient(d);const l=Object.assign({id:uid(),tx:{},showings:[]},d);S.listings.unshift(l);
  if(l.buildId){const b=getB(l.buildId);if(b&&!['Sold'].includes(b.status))b.status='Listed'}save();go('#listing/'+l.id);toast('Listing added')})},
 editListing(el){const l=getL(el.dataset.id);openForm('Edit listing',LIST_FIELDS,l,d=>{fillClient(d);const was=l.status;Object.assign(l,d);
  if(d.status==='Sold'&&was!=='Sold'&&!l.closeDate)l.closeDate=TODAY();if(l.buildId&&d.status==='Sold'){const b=getB(l.buildId);if(b)b.status='Sold'}save();render();toast('Saved')})},
 async delListing(el){const l=getL(el.dataset.id);if(!await ask(`Delete listing "${l.address}"?`))return;S.listings=S.listings.filter(x=>x!==l);save();go('#realestate');toast('Listing deleted')},
 lsFilter(el){S.ui.lsFilter=el.dataset.v;save();render()},
 addShowing(el){const l=getL(el.dataset.id);openForm('Log showing / open house',[F('date','Date','date',{req:1}),F('type','Type','select',{opts:['Showing','Open house','Second showing','Inspection','Appraisal']}),F('who','Agent / buyer','text',{full:1}),F('interest','Interest','select',{opts:['','High','Medium','Low']}),F('feedback','Feedback','textarea')],{date:TODAY(),type:'Showing'},d=>{l.showings.push(Object.assign({id:uid()},d));save();render();toast('Logged')})},
 delShowing(el){const l=getL(el.dataset.id);l.showings=l.showings.filter(s=>s.id!==el.dataset.s);save();render()},
 editTask(el){const t=S.tasks.find(x=>x.id===el.dataset.id);openForm('Edit task',TASK_FIELDS,t,d=>{Object.assign(t,d);save();render();toast('Saved')})},
 delTask(el){S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id);save();render();toast('Task deleted')},
 taskFilter(el){S.ui.taskFilter=el.dataset.v;save();render()},
 async clearDone(){const n=S.tasks.filter(t=>t.done).length;if(!await ask(`Remove ${n} completed task(s)?`))return;S.tasks=S.tasks.filter(t=>!t.done);save();render()},
 schFilter(el){S.ui.schFilter=el.dataset.v;save();render()},
 newContact(){openForm('Add contact',CONTACT_FIELDS,{},d=>{S.contacts.push(Object.assign({id:'c_'+uid()},d));save();render();toast('Contact added')})},
 editContact(el){const c=getC(el.dataset.id);openForm('Edit contact',CONTACT_FIELDS,c,d=>{Object.assign(c,d);save();render();toast('Saved')},
  `<button type="button" class="btn danger sm" data-act="delContact" data-id="${c.id}" style="margin-bottom:12px">${ic('trash',14)} Delete contact</button>`)},
 async delContact(el){if(!await ask('Delete this contact? It will disappear from checklist steps.'))return;S.contacts=S.contacts.filter(c=>c.id!==el.dataset.id);closeModal();save();render()},
 async export(){const data=JSON.stringify(S,null,2),fn='everstone-hub-backup-'+TODAY()+'.json';let ok=false;
  try{const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data});ok=true}}
  catch(e){if(e&&e.code==='declined'){toast('Backup not saved');return}toast('Download is not available here');return}
  if(!ok){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}}
  if(ok){S.meta.lastExport=TODAY();save();render();toast('Backup saved')}},
 async reset(){if(!await ask('This erases every build, listing, client, task and contact.','Erase'))return;if(!await ask('Last check: export a backup first if you might want this data back.','Erase everything'))return;S=seed();save();go('#dashboard');render();toast('Everything erased')}
};
const CH={
 step(el){const b=getB(el.dataset.b);const s=el.dataset.s;if(el.checked){b.checks[s]=true;b.doneAt[s]=TODAY()}else{delete b.checks[s];delete b.doneAt[s]}
  if(el.checked&&b.status==='Pre-construction'&&['p4','p5','p6'].includes((ALL_STEPS.find(x=>x.id===s)||{}).phaseId))b.status='Under construction';
  save();render();if(el.checked&&progress(b).pct===1)toast('Every step done — nice work!')},
 sdate(el){const b=getB(el.dataset.b);if(el.value)b.dates[el.dataset.s]=el.value;else delete b.dates[el.dataset.s];save();render();toast(el.value?'Planned for '+fmt(el.value):'Date cleared')},
 snote(el){const b=getB(el.dataset.b);const v=el.value.trim();if(v)b.notesBy[el.dataset.s]=v;else delete b.notesBy[el.dataset.s];save();toast('Note saved')},
 ckBuild(el){go('#checklist/'+el.value)},
 task(el){const t=S.tasks.find(x=>x.id===el.dataset.id);t.done=el.checked;t.doneAt=el.checked?TODAY():'';save();setTimeout(render,180)},
 tlink(el){const f=el.form;if(el.value.startsWith('build:'))f.cat.value='EverStone';else if(el.value)f.cat.value='Real Estate'},
 tx(el){const l=getL(el.dataset.id);if(el.checked)l.tx[el.dataset.k]=TODAY();else delete l.tx[el.dataset.k];
  if(el.checked&&el.dataset.k==='u1'&&['Active','Coming Soon'].includes(l.status)){l.status='Pending';toast('Status moved to Pending')}
  if(el.checked&&el.dataset.k==='u10'&&l.status!=='Sold'){l.status='Sold';if(!l.closeDate)l.closeDate=TODAY();if(l.buildId){const b=getB(l.buildId);if(b)b.status='Sold'}toast('Marked Sold 🎉')}
  const cl=l.clientId&&getCl(l.clientId);if(cl&&el.checked){if(el.dataset.k==='u1'&&cl.stage!=='Closed')cl.stage='Under contract';if(el.dataset.k==='u10'){cl.stage='Closed';cl.closedDate=TODAY()}}
  save();render()},
 field(el){const o=el.dataset.type==='build'?getB(el.dataset.id):getL(el.dataset.id);o[el.dataset.k]=el.value;save();toast('Saved')},
 meta(el){S.meta[el.dataset.k]=el.value;save();render();toast('Saved')},
 notify(el){const n=notifyCfg();n[el.dataset.k]=el.type==='checkbox'?el.checked:el.dataset.k==='lead'?+el.value:el.value;save();toast('Saved')},
 cfield(el){const c=getCl(el.dataset.id);c[el.dataset.k]=el.value;save();if(el.dataset.k!=='notes')render();toast('Saved')},
 clType(el){S.ui.clType=el.value;save();render()},
 import(el){const file=el.files[0];if(!file)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.builds))throw 0;
  if(!await ask('Replace everything in the hub with this backup?','Replace'))return;S=migrate(o);save();render();toast('Backup imported')}catch(e){toast('That file isn\'t an EverStone Hub backup')}};r.readAsText(file)}
};
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&!e.defaultPrevented){e.preventDefault();go(a.getAttribute('href'))}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;e.preventDefault();const f=ACT[el.dataset.act];f&&f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const f=CH[el.dataset.ch];f&&f(el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();handleForm(f)});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-form] button:not([type=button])');if(!btn)return;e.preventDefault();const f=btn.closest('[data-form]');if(f.reportValidity&&!f.reportValidity())return;handleForm(f)},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const el=e.target;if(el.tagName!=='INPUT')return;const f=el.closest('[data-form]');if(!f)return;e.preventDefault();if(f.reportValidity&&!f.reportValidity())return;handleForm(f)});
async function connectForm(f){const conn={url:f.elements.url.value.trim().replace(/\/+$/,''),key:f.elements.key.value.trim()};
 if(!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(conn.url+'/')){toast('The Worker address should start with https://');return}
 let r;try{r=await api('/state',{},conn)}catch(e){toast(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'Can\'t reach that address — check it and try again':e.message);return}
 if(r.state&&hasData()){const useCloud=await ask('Your cloud already has data. Use the cloud copy on this device? Choose Cancel to replace the cloud copy with this device\'s data instead.','Use cloud data');
  CONN=conn;if(useCloud){SYNC.version=r.version;applyRemote(r.state)}else{await push()}}
 else{CONN=conn;if(r.state){SYNC.version=r.version;applyRemote(r.state)}else{await push()}}
 try{localStorage.setItem(CONN_KEY,JSON.stringify(conn))}catch(e){}SYNC.state='synced';startSync();render();toast('Connected')}
function handleForm(f){
 if(f.dataset.form==='task'){const t={id:uid(),title:f.elements.title.value.trim(),cat:f.elements.cat.value,link:f.elements.link.value,due:f.elements.due.value,time:f.elements.time.value,pri:f.elements.pri.value,done:false,created:TODAY()};if(!t.title)return;S.tasks.unshift(t);save();render();toast('Task added');return}
 if(f.dataset.form==='connect'){connectForm(f);return}
 if(f.dataset.form==='log'){const c=getCl(f.dataset.id);const ty=f.elements.type.value,nt=f.elements.note.value.trim();c.log.push({id:uid(),date:TODAY(),type:ty,note:nt});if(ty!=='Note')c.lastContact=TODAY();save();render();toast('Logged');return}
 if(f.dataset.form==='modal'){const m=$('#modal');const d={};m._fields.forEach(fd=>{let v=f.elements[fd.k].value;if(typeof v==='string')v=v.trim();if(fd.t==='number'&&v!=='')v=+v;d[fd.k]=v});const cb=m._save;closeModal();cb&&cb(d)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});

/* ================= ROUTER ================= */
const NAV=[['sec','Overview'],['dashboard','Dashboard','grid'],['sec','EverStone'],['builds','Builds','home'],['checklist','Checklist','check'],['sec','Realtor'],['realtor','Realtor HQ','briefcase'],['clients','Clients','user'],['realestate','Listings & deals','tag'],['sec','Workflow'],['tasks','Tasks','list'],['schedule','Schedule','cal'],['contacts','Contacts','users'],['settings','Settings','gear']];
let lastHash=null;
let ROUTE=(location.hash||'').slice(1)||'dashboard';
function go(h){ROUTE=String(h||'').replace(/^#/,'')||'dashboard';try{if(!ROUTE.includes('/'))history.replaceState(null,'','#'+ROUTE)}catch(e){}render()}
function render(){const h=ROUTE;const[pg,id]=h.split('/');
 const over=S.tasks.filter(t=>!t.done&&t.due&&t.due<TODAY()).length;
 $('#nav').innerHTML=NAV.map(n=>n[0]==='sec'?`<div class="sec">${n[1]}</div>`:`<a href="#${n[0]}" class="${(pg===n[0]||(pg==='build'&&n[0]==='builds')||(pg==='listing'&&n[0]==='realestate')||(pg==='client'&&n[0]==='clients'))?'on':''}">${ic(n[2],18)}<span>${n[1]}</span>${n[0]==='tasks'&&over?`<span class="cnt">${over}</span>`:''}</a>`).join('');
 const P={dashboard:pgDashboard,builds:pgBuilds,build:()=>pgBuild(id),checklist:()=>pgChecklist(id),realestate:pgRealEstate,listing:()=>pgListing(id),tasks:pgTasks,schedule:pgSchedule,contacts:pgContacts,settings:pgSettings,realtor:pgRealtor,clients:pgClients,client:()=>pgClient(id)};
 const y=window.scrollY;$('#view').innerHTML=((STORAGE_OK||SYNC.state==='synced')?'':`<div class="banner">${ic('alert',18)}<div class="sp"><b>Changes won't be saved here.</b> This browser is blocking storage. Open the hub in Safari or Chrome, or connect sync in Settings.</div></div>`)+(P[pg]||pgDashboard)();
 if(lastHash!==h){window.scrollTo(0,0);lastHash=h}else window.scrollTo(0,y);
 document.title=({dashboard:'Dashboard',builds:'Builds',build:'Build',checklist:'Checklist',realestate:'Listings',listing:'Listing',tasks:'Tasks',schedule:'Schedule',contacts:'Contacts',settings:'Settings',realtor:'Realtor HQ',clients:'Clients',client:'Client'}[pg]||'Dashboard')+' · EverStone Hub'}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(h&&h!==ROUTE){ROUTE=h;render()}});
window.addEventListener('popstate',()=>{const h=(location.hash||'').slice(1)||'dashboard';if(h!==ROUTE){ROUTE=h;render()}});
render();
startSync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(checkPush).catch(()=>{})}
</script>
